[project]
name = "workstation-manager"
version = "0.1.0"
description = "Select, install and update applications for workstation-setup profiles"
readme = "README.md"
authors = [
    { name = "Csaba Palankai", email = "csaba.palankai@gmail.com" }
]
requires-python = ">=3.11"
# Kept minimal: `update` must run on a fresh machine; the web UI is the `server` extra
dependencies = [
    "ruamel-yaml>=0.19.1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
workstation-manager = "workstation_manager:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "workstation-manager[server]",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
